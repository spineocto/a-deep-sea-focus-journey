<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#02050a" />
    <link rel="icon" href="data:," />
    <title>Deep Sea Focus Journey</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <main id="app" class="scene" data-mood="normal" data-state="IDLE" data-zone="0">
      <!-- Depth tick marks scroll upward behind the scene as the bell sinks. -->
      <div class="depth-ticks" id="depth-ticks" aria-hidden="true"></div>

      <!-- A resident eye, far away and faint. It only opens wide when you look away. -->
      <img class="eye eye-far" id="eye-far" alt="" aria-hidden="true" />
      <img class="eye eye-giant" id="eye-giant" alt="" aria-hidden="true" />
      <div class="dread" aria-hidden="true"></div>

      <!-- The bell hangs on its cable; the Dumbo octopus rides inside. -->
      <div class="bell-anchor">
        <div class="bell-bob">
          <div class="bell-wrap" id="bell">
            <span class="cable" aria-hidden="true"></span>
            <span class="bell-glow" aria-hidden="true"></span>
            <img class="bell-img bell-normal" id="bell-normal" alt="" />
            <img class="bell-img bell-alert" id="bell-alert" alt="" />
            <img class="bell-img bell-sleeping" id="bell-sleeping" alt="" />
            <!-- Live companion: redrawn over the baked porthole so it can breathe, flap, lean and doze. -->
            <svg class="companion" id="companion" viewBox="0 0 900 880" aria-hidden="true">
              <defs>
                <clipPath id="co-port"><circle cx="450" cy="520" r="176" /></clipPath>
                <radialGradient id="co-bg" cx="50%" cy="58%" r="60%">
                  <stop offset="0" stop-color="#b56e50" />
                  <stop offset="0.7" stop-color="#8a4c38" />
                  <stop offset="1" stop-color="#6a3628" />
                </radialGradient>
                <radialGradient id="co-head" cx="50%" cy="38%" r="65%">
                  <stop offset="0" stop-color="#f8b3a0" />
                  <stop offset="1" stop-color="#ee9783" />
                </radialGradient>
              </defs>
              <g clip-path="url(#co-port)">
                <rect x="260" y="330" width="380" height="380" fill="url(#co-bg)" />
                <g class="co-lean">
                  <g class="co-body">
                    <path class="co-skirt" d="M330 575 L378 536 L520 536 L562 574 L520 600 L450 612 L380 600 Z" fill="#d4796b" />
                    <g class="co-ear co-ear-l"><path d="M372 478 L336 452 L312 462 L322 488 L340 500 L372 506 Z" fill="#d9786a" /></g>
                    <g class="co-ear co-ear-r"><path d="M528 478 L564 452 L588 462 L578 488 L560 500 L528 506 Z" fill="#d9786a" /></g>
                    <circle class="co-head" cx="450" cy="490" r="96" fill="url(#co-head)" />
                    <ellipse cx="432" cy="440" rx="34" ry="18" fill="#f8c0b0" opacity="0.7" />
                    <g class="co-face">
                      <g class="co-eyes">
                        <g class="co-eye"><ellipse cx="416" cy="508" rx="15" ry="17" fill="#2a1218" /><circle cx="411" cy="502" r="4.5" fill="#fff" /></g>
                        <g class="co-eye"><ellipse cx="484" cy="508" rx="15" ry="17" fill="#2a1218" /><circle cx="479" cy="502" r="4.5" fill="#fff" /></g>
                      </g>
                      <g class="co-lids" fill="none" stroke="#2a1218" stroke-width="3.5" stroke-linecap="round">
                        <path d="M400 516 Q416 528 432 516" /><path d="M468 516 Q484 528 500 516" />
                      </g>
                      <ellipse cx="392" cy="530" rx="14" ry="7" fill="#f08a80" opacity="0.5" />
                      <ellipse cx="508" cy="530" rx="14" ry="7" fill="#f08a80" opacity="0.5" />
                    </g>
                  </g>
                </g>
                <circle class="co-lamp-wash" cx="450" cy="520" r="176" />
              </g>
              <path d="M318 440 Q340 380 400 366" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round" />
            </svg>
            <span class="lamp-glow" aria-hidden="true"></span>
          </div>
        </div>
      </div>

      <header class="wordmark" aria-label="Deep Sea Focus Journey">
        <span class="wordmark-name">Deep Sea Focus Journey</span>
        <span id="demo-indicator" class="demo-indicator">DEMO x60</span>
      </header>

      <!-- Depth: one hairline on the left edge with a marker that sinks. -->
      <div class="depth-rail" aria-hidden="true">
        <span class="depth-rail-line"></span>
        <span class="depth-rail-marker" id="depth-marker"></span>
      </div>
      <div class="depth-readout" aria-live="off">
        <span class="mono" id="total-depth-display">0 m</span>
        <span class="depth-readout-zone" id="zone-display">Sunlit</span>
        <span class="depth-readout-round">Round <span class="mono" id="rounds-display">0</span></span>
        <span class="depth-readout-round hidden" id="descent-wrap">This dive <span class="mono" id="descent-depth-display">0 m</span></span>
      </div>

      <section class="hud">
        <div class="timer-ring">
          <svg class="ring" viewBox="0 0 200 200" aria-hidden="true">
            <circle class="ring-track" cx="100" cy="100" r="96" />
            <circle class="ring-oxygen" id="oxygen-ring" cx="100" cy="100" r="96" pathLength="100" />
          </svg>
          <span class="ring-label">O<sub>2</sub></span>
          <div id="time-display" class="timer" role="timer">--:--</div>
          <div id="state-display" class="caption" aria-live="polite">READY</div>
        </div>

        <div class="controls">
          <div id="duration-selection" class="durations hidden">
            <button id="duration-15" class="quiet" data-duration="15"><span class="mono">15</span> min</button>
            <button id="duration-25" class="quiet" data-duration="25"><span class="mono">25</span> min</button>
            <button id="duration-45" class="quiet" data-duration="45"><span class="mono">45</span> min</button>
          </div>
          <div class="actions">
            <button id="start-button" class="primary hidden">START DESCENT</button>
            <button id="abandon-button" class="quiet hidden">ABANDON</button>
            <button id="skip-break-button" class="quiet hidden">SKIP BREAK</button>
            <button id="ending-confirm-button" class="primary hidden">CONTINUE</button>
            <button id="dive-again-button" class="primary hidden">DIVE AGAIN</button>
            <button id="dive-again-subtle-button" class="quiet faint hidden">dive again</button>
          </div>
        </div>
      </section>

      <div class="corner corner-right corner-group">
        <button id="sound-toggle" class="quiet faint" aria-pressed="false">SOUND OFF</button>
        <button id="codex-toggle" class="quiet faint" aria-expanded="false">
          CODEX <span class="mono" id="codex-count">0/6</span>
        </button>
      </div>

      <!-- Codex drawer -->
      <aside id="codex-panel" class="codex-panel" aria-label="Creature codex" hidden>
        <div class="codex-head">
          <span>CODEX</span>
          <button id="codex-close" class="quiet faint" aria-label="Close codex">CLOSE</button>
        </div>
        <div id="codex-display" class="codex-list"></div>
      </aside>

      <!-- Debug tools: hidden unless ?debug=1 or Shift+D -->
      <div id="debug-panel" class="debug-panel hidden" aria-label="Debug controls">
        <div class="debug-row">
          <span class="debug-title">DEBUG</span>
          <button id="test-distraction-button" class="quiet">Test distraction</button>
          <button id="demo-mode-toggle" class="quiet">Toggle demo mode</button>
          <button id="motion-toggle" class="quiet">Motion: On</button>
          <button id="clear-data-button" class="quiet">Clear all data</button>
        </div>
        <div class="debug-row">
          <span class="debug-title">DEPTH</span>
          <input id="depth-scrubber" class="debug-scrubber" type="range"
                 min="0" max="10900" step="10" value="0"
                 aria-label="Preview depth in metres" />
          <span class="debug-depth mono" id="debug-depth-value">0 m</span>
          <button id="depth-release" class="quiet">Live</button>
        </div>
        <div class="debug-row">
          <span class="debug-title">JUMP</span>
          <button class="quiet" data-zone-jump="1">Sunlit</button>
          <button class="quiet" data-zone-jump="2">Twilight</button>
          <button class="quiet" data-zone-jump="3">Midnight</button>
          <button class="quiet" data-zone-jump="4">Abyssal</button>
          <button class="quiet" data-zone-jump="5">Hadal</button>
          <button id="jump-ending" class="quiet">Ending</button>
          <button id="preview-run" class="quiet">Preview 60s</button>
        </div>
      </div>

      <!-- Zone title: fades in briefly when a new zone is entered. -->
      <div id="zone-title" class="zone-title" aria-hidden="true">
        <span class="zone-title-name" id="zone-title-name"></span>
        <span class="zone-title-depth mono" id="zone-title-depth"></span>
      </div>

      <!-- Research-file card -->
      <div id="card-reveal" class="card-reveal" role="dialog" aria-modal="true" aria-labelledby="card-name">
        <article class="card-content">
          <div class="card-kicker" id="card-kicker">FIELD LOG</div>
          <div class="reveal-stage" id="card-art" aria-hidden="true">
            <img class="reveal-sil" id="card-art-sil" alt="" />
            <img class="reveal-lit" id="card-art-lit" alt="" />
          </div>
          <h2 class="card-title" id="card-name">Unknown</h2>
          <div class="card-zh" id="card-zh"></div>
          <div class="card-subtitle" id="card-scientific-name"></div>
          <dl class="card-meta">
            <div><dt>Zone</dt><dd id="card-zone"></dd></div>
            <div><dt>Depth</dt><dd class="mono" id="card-depth-range"></dd></div>
          </dl>
          <p class="card-facts" id="card-facts"></p>
          <p class="card-signal hidden" id="card-signal">SIGNAL DETECTED BELOW THE KNOWN DEPTH.</p>
          <button id="card-close-button" class="quiet">CONTINUE</button>
        </article>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
